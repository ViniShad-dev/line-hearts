<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Um pequeno jogo de Vini para Line">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Vini ♡ Line</title>
</head>
<body>
  <main id="game-shell" aria-label="Jogo de pegar corações">
    <canvas id="game" aria-label="Vini lança corações para a cesta da Line"></canvas>
    <div class="hud" aria-live="polite">
      <div id="score"><span>♥</span> <b>0</b></div>
      <button id="sound" type="button" aria-label="Desativar som" aria-pressed="true">
        <svg class="sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2-3.74v7.48a4.5 4.5 0 0 0 2-3.74zm-2-8.24v2.06a7 7 0 0 1 0 12.36v2.06a9 9 0 0 0 0-16.48z"/></svg>
        <svg class="sound-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm11.6 3 2.2-2.2-1.4-1.4-2.2 2.2L12 8.4 10.6 9.8l2.2 2.2-2.2 2.2 1.4 1.4 2.2-2.2 2.2 2.2 1.4-1.4z"/></svg>
      </button>
    </div>
    <section id="intro" aria-label="Início">
      <div class="intro-card">
        <div class="intro-name">Vini</div>
        <div class="intro-heart">♥</div>
        <div class="intro-basket"><i></i><strong>Line ♡</strong></div>
        <button id="start" type="button">toque para começar</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
